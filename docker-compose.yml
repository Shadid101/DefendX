services:
  grafana:
    image: grafana/grafana:12.4
    container_name: defendx-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_PLUGINS_PREINSTALL: "frser-sqlite-datasource"
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Create a .env file with GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
    volumes:
      - grafana-storage:/var/lib/grafana
      # Only non-sensitive telemetry is mounted; auth DB and keys are private.
      - ./data:/var/lib/defendx:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/defendx-dashboards:ro
volumes:
  grafana-storage:
